# Example production topology: an external managed Postgres (RDS, Cloud SQL, etc — not run by
# compose), gunicorn with several uvicorn workers, and migrations run as a separate one-off
# step rather than on every container start (see the "migrate" profile below).
#
# Usage:
#   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d api
services:
  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
    command: ["alembic", "upgrade", "head"]
    profiles: ["migrate"]
